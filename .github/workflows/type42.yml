name: Winbond cartridge builds and software checks
on:
  push:
    paths: ['source/Pico VSCode Project/a8_pico_cart/**', '.github/workflows/type42.yml', 'TYPE42.md']
  pull_request:
    paths: ['source/Pico VSCode Project/a8_pico_cart/**', '.github/workflows/type42.yml', 'TYPE42.md']
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type42: ['OFF', 'ON']
    env:
      SRC: source/Pico VSCode Project/a8_pico_cart
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib cmake ninja-build
          TOOLCHAIN=arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi
          curl -fL --retry 3 "https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/$TOOLCHAIN.tar.xz" -o "$RUNNER_TEMP/$TOOLCHAIN.tar.xz"
          echo "d420d87f68615d9163b99bbb62fe69e85132dc0a8cd69fca04e813597fe06121  $RUNNER_TEMP/$TOOLCHAIN.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$TOOLCHAIN.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          python -m pip install unicorn==2.1.4 pyelftools==0.32 capstone==5.0.6 py65==1.2.0
          git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Build firmware and check actual loader
        run: |
          cmake -S "$SRC" -B build -G Ninja -DPICO_TOOLCHAIN_PATH="$RUNNER_TEMP/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi" -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DCMAKE_BUILD_TYPE=Release -DPICO_NO_PICOTOOL=1 -DA8_ENABLE_TYPE42=${{ matrix.type42 }}
          cmake --build build --parallel 2
          python "$SRC/bin_to_uf2.py" build/a8_pico_cart.bin build/a8_pico_cart.uf2
          python "$SRC/tests/compiled_loader.py" build/a8_pico_cart.elf
      - name: Check linked mapper logic and real FatFs parsers
        if: matrix.type42 == 'ON'
        run: |
          for type in 42 75 109 110 112; do
            python "$SRC/tests/compiled_bus.py" build/a8_pico_cart.elf --car-type="$type"
          done
          python "$SRC/tests/megacart_bus.py" build/a8_pico_cart.elf
          cc -m32 -std=c11 -O2 -I"$SRC" -I"$SRC/fatfs" "$SRC/tests/host_type42.c" "$SRC/type42_image.c" "$SRC/fatfs/ff.c" "$SRC/fatfs/ffunicode.c" -o build/host-type42
          build/host-type42
          for type in 61 63; do
            cc -m32 -std=c11 -O2 -I"$SRC" -I"$SRC/fatfs" "$SRC/tests/host_type$type.c" "$SRC/type63_image.c" "$SRC/type42_image.c" "$SRC/fatfs/ff.c" "$SRC/fatfs/ffunicode.c" -o "build/host-type$type"
            "build/host-type$type"
          done
          python "$SRC/tests/type61_bus.py" build/a8_pico_cart.elf --preflight --report build/type61.json
          python "$SRC/tests/type63_bus.py" build/a8_pico_cart.elf --report build/type63.json
          python "$SRC/tests/type63_preflight.py" build/a8_pico_cart.elf --report build/preflight63.json
      - uses: actions/upload-artifact@v4
        with:
          name: a8picocart-winbond-${{ matrix.type42 }}
          path: |
            build/a8_pico_cart.uf2
            build/type61.json
            build/type63.json
            build/preflight63.json
